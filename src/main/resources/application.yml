spring:
  application:
    name: seatlock
  datasource:
    # In-memory H2 in MySQL mode for local development; see the "mysql" profile below.
    url: jdbc:h2:mem:seatlock;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  artemis:
    # Broker runs inside the app (in memory, so queued messages do not survive a restart).
    # For production set mode: native plus broker-url, user and password for a standalone broker.
    mode: embedded
    embedded:
      queues: ticket-purchase-queue,DLQ.ticket-purchase-queue

  mail:
    # The mail server is set with environment variables, never committed:
    # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (see the README).
    # Without SPRING_MAIL_HOST, emails are skipped with a warning.
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  servlet:
    session:
      # Signed-in buyers are kept by this cookie; Lax keeps it off cross-site form posts.
      cookie:
        same-site: lax
        http-only: true
      timeout: 2h
  # A 5,000-seat map is ~390 KB of JSON; gzip cuts it to a small fraction for clients that accept it.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

seatlock:
  holds:
    ttl: PT10M
    max-seats-per-hold: 8
    sweep-batch-size: 200
    sweep-interval: PT30S
    sweeper-enabled: true
  # Token bucket per client IP on the checkout endpoints; over the limit gets 429 + Retry-After.
  rate-limit:
    enabled: true
    requests-per-second: 5
    paths:
      - /api/events/*/holds
      - /api/events/*/purchase-requests
      - /api/holds/*/confirm
      # Sign-in, sign-up and password resets: slows down password guessing and email flooding.
      - /api/auth/*
      # Find my tickets: slows down guessing ticket codes and requesting codes for many emails.
      - /api/tickets/*
  accounts:
    reset-token-ttl: PT30M
    # Address of the web client, used for links in emails.
    base-url: ${SEATLOCK_BASE_URL:http://localhost:8080}
    # Sender of SeatLock emails. With Gmail this must be the Gmail address you sign in with.
    mail-from: ${SEATLOCK_MAIL_FROM:SeatLock <no-reply@seatlock.local>}
    # Time zone for concert times in emails, e.g. Asia/Kolkata; empty means the server's own.
    time-zone: ${SEATLOCK_TIME_ZONE:}
  # Queued checkout: retries with growing delays, then the dead-letter queue.
  queue:
    consumers: 1-4
    max-delivery-attempts: 4
    redelivery-delay: PT0.5S
    redelivery-multiplier: 2.0

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SEATLOCK_DB_URL:jdbc:mysql://localhost:3306/seatlock}
    username: ${SEATLOCK_DB_USER:seatlock}
    password: ${SEATLOCK_DB_PASSWORD:seatlock}

---
# Demo data, and with no mail server set up, emails are kept in the demo outbox (/outbox.html)
# instead of being dropped, so booking emails and ticket codes can be seen. The outbox only
# answers requests from this machine; never turn it on for a public server.
spring:
  config:
    activate:
      on-profile: demo
seatlock:
  mail:
    demo-outbox: true

spring:
  datasource:
    url: jdbc:h2:mem:seatlock-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1

seatlock:
  holds:
    sweeper-enabled: false
  rate-limit:
    # The test clock is frozen, so buckets would never refill; RateLimitingFilterTest covers the filter.
    enabled: false
  queue:
    # Short retry delays so the dead-letter tests finish quickly.
    redelivery-delay: PT0.05S

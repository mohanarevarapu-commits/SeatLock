# Default run: 500 concurrent fans against a local app, headless, with reports.
# Usage from the repository root: locust --config load-test/locust.conf
locustfile = load-test/locustfile.py
host = http://localhost:8080
headless = true
users = 500
spawn-rate = 50
run-time = 2m
csv = load-test/results/seatlock
html = load-test/results/report.html
only-summary = true
